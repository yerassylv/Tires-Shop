<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Tire Shop</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/admin.js" defer></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-container">
                <a href="/">
                    <img src="/images/DALL.webp" alt="Tire Shop Logo" class="logo">
                </a>
                <h1>Tire Shop</h1>
            </div>
        </div>
        <div class="header-bottom">
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/admin">Admin Panel</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h2>Admin Panel</h2>
        <section id="products">
            <h3>Manage Products</h3>
            <button id="add-product">Add Product</button>
            <div id="product-list">
                <!-- Список продуктов будет загружен здесь -->
            </div>
        </section>
        <section id="users">
            <h3>Manage Users</h3>
            <div id="user-list">
                <!-- Список пользователей будет загружен здесь -->
            </div>
        </section>
    </main>
</body>
</html>
