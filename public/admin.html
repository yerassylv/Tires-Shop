<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Tire Shop</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/admin.js" defer></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-container">
                <a href="/">
                    <img src="/images/DALL.webp" alt="Tire Shop Logo" class="logo">
                </a>
                <h1>Tire Shop</h1>
                <div class="city-selector">
                    <label for="city">Ваш город:</label>
                    <select id="city">
                        <option value="almaty">Алматы</option>
                        <option value="astana">Астана</option>
                        <option value="shymkent">Шымкент</option>
                    </select>
                </div>
            </div>
            <div class="header-info">
                <div class="search-container">
                    <input type="text" placeholder="Поиск...">
                    <button>Найти</button>
                </div>
                <div class="contact-info">
                    <svg class="phone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92V21a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 1 4.18 2 2 0 0 1 3 2h4.09a2 2 0 0 1 2 1.72c.12.83.37 1.65.73 2.42a2 2 0 0 1-.45 2.11L8.91 9.91a16 16 0 0 0 6 6l1.66-1.66a2 2 0 0 1 2.11-.45c.77.36 1.59.61 2.42.73A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <p>+7 (700) 123-45-67</p>
                </div>
            </div>
        </div>
        <div class="header-bottom">
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/cart">Cart</a></li>
                    <li><a href="/favorites">Favorites</a></li>
                    <li><a href="/profile">Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section id="products">
            <h3>Manage Products</h3>
            <button id="add-product">Add Product</button>
            <div id="product-list">
                <!-- Список продуктов будет загружен здесь -->
            </div>
        </section>

        <!-- Модальное окно для добавления продукта -->
        <div id="product-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add Product</h2>
                <form id="product-form">
                    <input type="text" id="brand" placeholder="Brand" required>
                    <input type="text" id="model" placeholder="Model" required>
                    <input type="text" id="size" placeholder="Size" required>
                    <select id="season" required>
                        <option value="summer">Summer</option>
                        <option value="winter">Winter</option>
                        <option value="all-season">All Season</option>
                    </select>
                    <input type="number" id="loadIndex" placeholder="Load Index" required>
                    <input type="text" id="speedIndex" placeholder="Speed Index" required>
                    <select id="vehicleType" required>
                        <option value="passenger">Passenger</option>
                        <option value="SUV">SUV</option>
                        <option value="commercial">Commercial</option>
                    </select>
                    <input type="checkbox" id="studded"> Studded
                    <input type="number" id="price" placeholder="Price" required>
                    <input type="number" id="stock" placeholder="Stock">
                    <textarea id="description" placeholder="Description"></textarea>
                    <input type="file" id="image" accept="image/*">
                    <button type="submit">Add Product</button>
                </form>
                <p id="product-message"></p>
            </div>
        </div>

        <section id="users">
            <h3>Manage Users</h3>
            <div id="user-list">
                <!-- Список пользователей будет загружен здесь -->
            </div>
        </section>
    </main>
</body>
</html>
