<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tires - Tire Shop</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="logo-container">
                <a href="/">
                    <img src="/images/DALL.webp" alt="Tire Shop Logo" class="logo">
                </a>
                <h1>Tire Shop</h1>
                <div class="city-selector">
                    <label for="city">Ваш город:</label>
                    <select id="city">
                        <option value="almaty">Алматы</option>
                        <option value="astana">Астана</option>
                        <option value="shymkent">Шымкент</option>
                    </select>
                </div>
            </div>
            <div class="header-info">
                <div class="search-container">
                    <input type="text" placeholder="Поиск...">
                    <button>Найти</button>
                </div>
                <div class="contact-info">
                    <svg class="phone-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92V21a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 1 4.18 2 2 0 0 1 3 2h4.09a2 2 0 0 1 2 1.72c.12.83.37 1.65.73 2.42a2 2 0 0 1-.45 2.11L8.91 9.91a16 16 0 0 0 6 6l1.66-1.66a2 2 0 0 1 2.11-.45c.77.36 1.59.61 2.42.73A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <p>+7 (700) 123-45-67</p>
                </div>
            </div>
        </div>
        <div class="header-bottom">
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/cart">Cart</a></li>
                    <li><a href="/favorites">Favorites</a></li>
                    <li><a href="/profile">Profile</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <h2>Passenger Tires in Almaty - Buy Tires at TireX Online Store</h2>
        <div class="container">
            <aside id="filter-panel">
                <form id="filter-form">
                    <!-- Фильтр по бренду -->
                    <div class="filter-section">
                        <h3>Бренд</h3>
                        <label><input type="checkbox" name="brand" value="Continental"> Continental</label>
                        <label><input type="checkbox" name="brand" value="Bridgestone"> Bridgestone</label>
                        <label><input type="checkbox" name="brand" value="Michelin"> Michelin</label>
                        <label><input type="checkbox" name="brand" value="Yokohama"> Yokohama</label>
                    </div>

                    <!-- Фильтр по размеру -->
                    <div class="filter-section">
                        <h3>Размер</h3>
                        <label>Ширина: <input type="number" name="width" min="100" max="500"></label>
                        <label>Профиль: <input type="number" name="profile" min="30" max="100"></label>
                        <label>Диаметр: <input type="number" name="diameter" min="13" max="22"></label>
                    </div>

                    <!-- Фильтр по сезонности -->
                    <div class="filter-section">
                        <h3>Сезонность</h3>
                        <label><input type="radio" name="season" value="summer"> Летние</label>
                        <label><input type="radio" name="season" value="winter"> Зимние</label>
                        <label><input type="radio" name="season" value="all-season"> Всесезонные</label>
                    </div>

                    <!-- Фильтр по цене -->
                    <div class="filter-section">
                        <h3>Цена</h3>
                        <label>От: <input type="number" name="price_min" min="0"></label>
                        <label>До: <input type="number" name="price_max" min="0"></label>
                    </div>

                    <button type="submit">Применить фильтры</button>
                </form>
            </aside>
            <div class="product-list" id="catalog">
                <!-- Products will be loaded here -->
            </div>
        </div>
        <div id="pagination" class="pagination">
            <!-- Pagination buttons will be loaded here -->
        </div>
        <p id="message"></p>
    </main>
    <footer>
        <p>&copy; 2023 Tire Shop. Все права защищены.</p>
        <p>Контакты: +7 (700) 123-45-67 | bolatkannn@gmail.com</p>
    </footer>
</body>
</html>
